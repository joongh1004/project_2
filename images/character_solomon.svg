<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-solomon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="32" fill="url(#bg-solomon)" />
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#gold-grad)" stroke-width="3" opacity="0.7" />
  <rect x="24" y="24" width="452" height="452" rx="18" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3" />

  <!-- Radiant Aura -->
  <circle cx="250" cy="200" r="130" fill="url(#gold-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Symbol Icon: Temple & Crown -->
  <g transform="translate(170, 100) scale(1.6)" filter="url(#glow)">
    <!-- Crown -->
    <path d="M20 50 L35 20 L50 40 L65 20 L80 50 Z" fill="url(#gold-grad)" />
    <circle cx="20" cy="50" r="4" fill="#fff" />
    <circle cx="35" cy="20" r="4" fill="#fff" />
    <circle cx="50" cy="40" r="4" fill="#fff" />
    <circle cx="65" cy="20" r="4" fill="#fff" />
    <circle cx="80" cy="50" r="4" fill="#fff" />
    <!-- Temple Pillars -->
    <rect x="25" y="55" width="50" height="8" rx="2" fill="url(#gold-grad)" />
    <rect x="30" y="65" width="8" height="35" rx="1" fill="url(#gold-grad)" />
    <rect x="46" y="65" width="8" height="35" rx="1" fill="url(#gold-grad)" opacity="0.8" />
    <rect x="62" y="65" width="8" height="35" rx="1" fill="url(#gold-grad)" />
    <rect x="20" y="102" width="60" height="8" rx="2" fill="url(#gold-grad)" />
  </g>

  <!-- Title Badge -->
  <rect x="70" y="320" width="360" height="130" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="url(#gold-grad)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#fef08a" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">솔로몬 (King Solomon)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">독창적 지혜와 탁월성의 지혜 왕</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"듣는 마음을 주사 선악을 분별하게 하소서"</text>
</svg>
