<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-peter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="fire-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="url(#bg-peter)" />
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#fire-grad)" stroke-width="2" opacity="0.6" />

  <circle cx="250" cy="190" r="120" fill="url(#fire-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Crossed Keys & Boat Anchor -->
  <g transform="translate(170, 95) scale(1.3)" filter="url(#glow)">
    <!-- Key 1 -->
    <path d="M20 20 L95 95 M80 80 L90 70 M88 88 L98 78" stroke="url(#fire-grad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="25" cy="25" r="12" fill="none" stroke="url(#fire-grad)" stroke-width="5" />
    <!-- Key 2 -->
    <path d="M100 20 L25 95 M35 80 L25 70 M27 88 L17 78" stroke="url(#fire-grad)" stroke-width="6" stroke-linecap="round" />
    <circle cx="95" cy="25" r="12" fill="none" stroke="url(#fire-grad)" stroke-width="5" />
  </g>

  <rect x="60" y="320" width="380" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#fire-grad)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#fde047" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">사도 베드로 (Simon Peter)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">열정과 담대함의 불꽃 제자</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"주는 그리스도시요 살아계신 하나님의 아들이시니이다"</text>
</svg>
