<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-jeremiah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="silver-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="url(#bg-jeremiah)" />
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#silver-blue)" stroke-width="2" opacity="0.6" />

  <circle cx="250" cy="190" r="120" fill="url(#silver-blue)" opacity="0.12" filter="url(#glow)" />

  <!-- Scroll & Tear Symbol -->
  <g transform="translate(180, 100) scale(1.4)" filter="url(#glow)">
    <path d="M25 30 Q40 10 65 30 T105 30 L95 100 Q70 80 45 100 T15 100 Z" fill="none" stroke="url(#silver-blue)" stroke-width="4" />
    <path d="M40 45 L80 45 M35 60 L75 60 M40 75 L70 75" stroke="#93c5fd" stroke-width="2" stroke-linecap="round" />
    <!-- Tear drop -->
    <path d="M85 95 C85 85 95 75 95 75 C95 75 105 85 105 95 C105 102 99 108 95 108 C91 108 85 102 85 95 Z" fill="#60a5fa" opacity="0.85" />
  </g>

  <rect x="60" y="320" width="380" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#silver-blue)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#93c5fd" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">예레미야 (Jeremiah)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">눈물과 영적 묵상의 선지자</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"내 눈이 눈물에 창일하며 내 마음이 저리니"</text>
</svg>
