<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-elijah" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="url(#bg-elijah)" />
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#flame-grad)" stroke-width="2" opacity="0.6" />

  <circle cx="250" cy="190" r="120" fill="url(#flame-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Chariot Flame Altar -->
  <g transform="translate(170, 90) scale(1.3)" filter="url(#glow)">
    <!-- Altar Stones -->
    <rect x="25" y="85" width="70" height="25" rx="3" fill="#334155" stroke="url(#flame-grad)" stroke-width="2" />
    <rect x="35" y="70" width="50" height="15" rx="2" fill="#475569" stroke="url(#flame-grad)" stroke-width="2" />
    <!-- Divine Flame -->
    <path d="M60 10 C40 35 30 50 35 70 C45 75 75 75 85 70 C90 50 80 35 60 10 Z" fill="url(#flame-grad)" />
    <path d="M60 25 C50 40 45 50 48 65 C55 68 65 68 72 65 C75 50 70 40 60 25 Z" fill="#fef08a" />
  </g>

  <rect x="60" y="320" width="380" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#flame-grad)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#fef08a" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">엘리야 (Elijah)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">갈멜산의 담대한 불꽃 도전자</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"여호와여 내게 응답하옵소서 내게 응답하옵소서"</text>
</svg>
