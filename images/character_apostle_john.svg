<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-john" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="url(#bg-john)" />
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#cyan-grad)" stroke-width="2" opacity="0.6" />

  <circle cx="250" cy="190" r="120" fill="url(#cyan-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Eagle & Book Symbol -->
  <g transform="translate(170, 95) scale(1.3)" filter="url(#glow)">
    <!-- Eagle Wings -->
    <path d="M60 20 C30 10 10 35 0 60 C25 55 45 45 60 40 C75 45 95 55 120 60 C110 35 90 10 60 20 Z" fill="url(#cyan-grad)" opacity="0.9" />
    <!-- Book -->
    <rect x="30" y="65" width="60" height="40" rx="4" fill="#0f172a" stroke="url(#cyan-grad)" stroke-width="3" />
    <line x1="60" y1="65" x2="60" y2="105" stroke="url(#cyan-grad)" stroke-width="2" />
    <path d="M40 75 L52 75 M40 85 L52 85 M68 75 L80 75 M68 85 L80 85" stroke="#38bdf8" stroke-width="2" />
  </g>

  <rect x="60" y="320" width="380" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#cyan-grad)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#38bdf8" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">사도 요한 (Apostle John)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">영적 신비와 지혜 탐구의 사도</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니"</text>
</svg>
