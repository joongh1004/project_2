<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-boaz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f6212" />
      <stop offset="50%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="bronze-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="32" fill="url(#bg-boaz)" />
  <rect x="16" y="16" width="468" height="468" rx="24" fill="none" stroke="url(#bronze-grad)" stroke-width="2" opacity="0.6" />

  <circle cx="250" cy="190" r="120" fill="url(#bronze-grad)" opacity="0.15" filter="url(#glow)" />

  <!-- Shield & Wheat Gate -->
  <g transform="translate(170, 95) scale(1.3)" filter="url(#glow)">
    <path d="M20 30 C 60 10, 60 10, 100 30 V 70 C 100 100, 60 115, 60 115 C 60 115, 20 100, 20 70 Z" fill="url(#bronze-grad)" opacity="0.85" />
    <path d="M40 50 L60 35 L80 50 M60 35 V85" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />
  </g>

  <rect x="60" y="320" width="380" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="url(#bronze-grad)" stroke-width="1.5" />
  
  <text x="250" y="360" text-anchor="middle" fill="#84cc16" font-family="'Pretendard', sans-serif" font-size="28" font-weight="800" letter-spacing="1">보아스 (Boaz)</text>
  <text x="250" y="392" text-anchor="middle" fill="#cbd5e1" font-family="'Pretendard', sans-serif" font-size="16" font-weight="500">약자의 든든한 울타리와 유력자</text>
  <text x="250" y="424" text-anchor="middle" fill="#94a3b8" font-family="'Pretendard', sans-serif" font-size="13" font-style="italic">"여호와께서 네가 행한 일에 완전한 상 주시기를 원하노라"</text>
</svg>
